version: '3.5'

services:
  ### Jesse's Workspace ################################################
  jesse:
    image: salehmir/jesse:3.4.0
    depends_on:
      - postgres
    tty: true
    env_file:
      - ../.env
    ports:
      - "9000:9000"
      # MCP Server Port
      - "9002:9002"
      # Jupyter Port
      - "8888:8888"
      # LSP Port
      - "9001:9001"
    volumes:
      - ../:/home
    container_name: jesse
    # 🔧 FIX: Skip 'jesse install-live --no-strict' — causes circular import (jesse_live→jesse.routes→jesse.models.Exchange→jesse.routes)
    # when the plugin is already installed. Use 'jesse run' directly.
    command: bash -c "jesse run"
    restart: unless-stopped

  ### PostgreSQL ################################################
  postgres:
    image: postgres:14-alpine
    restart: always
    environment:
      - POSTGRES_USER=jesse_user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=jesse_db
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    container_name: postgres

volumes:
  postgres-data:
