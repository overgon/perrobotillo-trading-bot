version: '3.5'

services:
  ### Jesse's Workspace ################################################
  jesse:
    image: salehmir/jesse:3.5.3
    depends_on:
      - postgres
    tty: true
    env_file:
      - ../.env
    ports:
      - "9000:9000"
      # MCP Server Port
      - "9002:9002"
      # Jupyter Port
      - "8888:8888"
      # LSP Port
      - "9001:9001"
    volumes:
      - ../:/home
    container_name: jesse
    # FIX (2026-10-26): Use 'jesse run' directly — 'jesse install-live --no-strict' causes
    # circular import when plugin is already installed. Matches jesse-research setup.
    command: bash -c "jesse run"

  ### PostgreSQL ################################################
  postgres:
    image: postgres:14-alpine
    restart: always
    environment:
      - POSTGRES_USER=jesse_user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=jesse_db
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    container_name: postgres

  ### Honeygain ################################################
  # Docker-rpi5-v2: unique device name to avoid "Network Overused" conflict
  # with old Docker myPi5-b / Docker myPi3 devices on same public IP
  # env_file loads credentials from /home/overgon/.honeygain.env (never in git)
  # ${VAR} interpolation reads from .env (git-ignored) at compose startup
  honeygain:
    image: honeygain/honeygain:latest
    container_name: honeygain-rpi5-v2
    restart: unless-stopped
    network_mode: host
    working_dir: /app
    env_file:
      - /home/overgon/.honeygain.env
    command: ["-tou-accept", "-email", "${HONEYGAIN_EMAIL}", "-pass", "${HONEYGAIN_PASS}", "-device", "Docker-rpi5-v2"]

volumes:
  postgres-data:
