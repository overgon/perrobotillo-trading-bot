# ═══════════════════════════════════════════════════════════════════════════
# 🐕 PERROBOTILLO - CI (Jesse AI) — Backtest Gate
# Issue #66: gate de regresión del backtest de la estrategia Perrobotillo.
#
# Fixes (2026-11-17):
#   - trigger push corregido a `main` (el repo no usa `master`)
#   - PostgreSQL como service container (antes fallaba `psql -U postgres`)
#   - se importan las velas del periodo del backtest antes de correr el gate
#   - el gate compara contra research/ci_baseline.json (baseline + latest)
# ═══════════════════════════════════════════════════════════════════════════
name: ci-backtest

on:
  pull_request:
    paths:
      - "strategies/**"
      - "research/**"
      - "routes.py"
      - ".github/workflows/ci-backtest.yml"
  push:
    branches: [main]
    paths:
      - "strategies/**"
      - "research/**"
      - "routes.py"
      - ".github/workflows/ci-backtest.yml"

env:
  PYTHON_VERSION: "3.13"
  # Start EXPLICITO (medianoche): con --days 90 el start llevaba la hora del runner
  # y el mismo periodo daba Sharpe 2.79 o 2.01 segun la hora -> falsas regresiones.
  BACKTEST_START: "2026-08-21"
  BACKTEST_SYMBOL: "ALL"

jobs:
  gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: jesse
          POSTGRES_PASSWORD: jesse
          POSTGRES_DB: jesse_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jesse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install jesse pandas numpy scipy scikit-learn requests

      - name: Configurar .env de Jesse
        run: |
          cat > .env <<'EOF'
          PASSWORD=ci-backtest-local
          APP_PORT=9000
          POSTGRES_HOST=localhost
          POSTGRES_NAME=jesse_db
          POSTGRES_PORT=5432
          POSTGRES_USERNAME=jesse
          POSTGRES_PASSWORD=jesse
          TIMESCALEDB_ENABLED=FALSE
          EOF

      - name: Esperar PostgreSQL
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -U jesse && break
            sleep 2
          done
          pg_isready -h localhost -U jesse

      - name: Importar velas del periodo
        run: |
          START=$(date -u -d "$BACKTEST_START - 20 days" +%Y-%m-%d)
          END=$(date -u +%Y-%m-%d)
          echo "Velas: 8 monedas  $START → $END"
          python research/jesse_import_candles.py \
            --coins BTC,ETH,BNB,SOL,LINK,XRP,AVAX,ZEC --start "$START" --end "$END"
        env:
          BACKTEST_START: ${{ env.BACKTEST_START }}

      - name: Backtest gate
        run: |
          # --slippage-bps 5 para que el fee efectivo (0.15%) sea el mismo con el
          # que se generó research/ci_baseline.json. Sin esta flag el backtest
          # usaba 0.10% y el gate comparaba contra un baseline distinto.
          # --start explicito (no --days) para que la ventana sea reproducible.
          python research/run_full_backtest.py --symbol "$BACKTEST_SYMBOL" --start "$BACKTEST_START" --slippage-bps 5 --out backtest.json
          python research/ci_backtest_gate.py backtest.json
        env:
          BACKTEST_START: ${{ env.BACKTEST_START }}
          BACKTEST_SYMBOL: ${{ env.BACKTEST_SYMBOL }}
          # Modo determinista: sin modelo ML (está en .gitignore), el mismo que
          # usa el baseline. Ver strategies/perrobotillo.
          PERROBOTILLO_ML_DISABLE: "1"

      - name: Upload backtest artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-report
          path: backtest.json
