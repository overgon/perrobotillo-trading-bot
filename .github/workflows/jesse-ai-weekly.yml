# ═══════════════════════════════════════════════════════════════════════════
# 🐕 PERROBOTILLO - Weekly Retrain Pipeline (Jesse AI)
# Issue #66: reentrenamiento semanal del ML de Perrobotillo con Jesse.
#
# Fixes (2026-11-17):
#   - YAML corregido (el bloque `python -c` de métricas rompía el parser y el
#     workflow ni siquiera aparecía registrado en Actions)
#   - reentrena con Jesse (gather + train) en vez de ml/auto-retrain-v2.py,
#     que requiere rutas de ~/.openclaw/workspace que no existen en el runner
#   - PostgreSQL como service container + velas importadas del periodo
# ═══════════════════════════════════════════════════════════════════════════
name: jesse-ai-weekly-retrain

on:
  schedule:
    - cron: '0 3 * * 0'   # domingo 03:00 UTC
  workflow_dispatch:
    inputs:
      coin:
        description: 'Moneda a re-entrenar (vacío = todas)'
        required: false
        default: ''
      dry_run:
        description: 'Modo seco (sin guardar artefactos)'
        required: false
        default: 'false'

env:
  PYTHON_VERSION: "3.13"
  RETRAIN_YEARS: "2"

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      coins: ${{ steps.coins.outputs.coins }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Conjunto de monedas
        id: coins
        run: |
          if [ -n "${{ github.event.inputs.coin }}" ]; then
            echo "coins=${{ github.event.inputs.coin }}" >> "$GITHUB_OUTPUT"
          else
            echo "coins=BTC,ETH,BNB,SOL,LINK,XRP,AVAX,ZEC" >> "$GITHUB_OUTPUT"
          fi

  retrain:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: jesse
          POSTGRES_PASSWORD: jesse
          POSTGRES_DB: jesse_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jesse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install jesse pandas numpy scipy scikit-learn joblib requests

      - name: Configurar .env de Jesse
        run: |
          cat > .env <<'EOF'
          PASSWORD=weekly-retrain-local
          APP_PORT=9000
          POSTGRES_HOST=localhost
          POSTGRES_NAME=jesse_db
          POSTGRES_PORT=5432
          POSTGRES_USERNAME=jesse
          POSTGRES_PASSWORD=jesse
          TIMESCALEDB_ENABLED=FALSE
          EOF

      - name: Esperar PostgreSQL
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -U jesse && break
            sleep 2
          done
          pg_isready -h localhost -U jesse

      - name: Importar velas (2 años)
        run: |
          START=$(date -u -d "-${RETRAIN_YEARS} years" +%Y-%m-%d)
          END=$(date -u +%Y-%m-%d)
          echo "Velas: ${{ needs.setup.outputs.coins }}  $START → $END"
          python research/jesse_import_candles.py \
            --coins "${{ needs.setup.outputs.coins }}" --start "$START" --end "$END"
        env:
          RETRAIN_YEARS: ${{ env.RETRAIN_YEARS }}

      - name: Re-entrenar modelos (Jesse gather + train)
        run: |
          START=$(date -u -d "-${RETRAIN_YEARS} years" +%Y-%m-%d)
          END=$(date -u +%Y-%m-%d)
          python research/jesse_ml_train.py \
            --coins "${{ needs.setup.outputs.coins }}" \
            --start "$START" --end "$END" --model rf --fast --quiet
        env:
          RETRAIN_YEARS: ${{ env.RETRAIN_YEARS }}

      - name: Resumen de métricas
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path('strategies/perrobotillo/ml_data/training_summary.json')
          if not p.exists():
              print('No hay training_summary.json')
              raise SystemExit(0)
          data = json.loads(p.read_text())
          ok = [c for c, v in data.items() if 'error' not in v]
          bad = [c for c, v in data.items() if 'error' in v]
          print(f'OK: {ok}')
          print(f'FALLO: {bad}')
          for c, v in data.items():
              if 'error' in v:
                  continue
              m = v.get('metrics') or {}
              print(f"{c}: acc={m.get('accuracy')} auc={m.get('roc_auc')} n={v.get('n_samples')}")
          if bad:
              raise SystemExit(1)
          PY

      - name: Upload modelos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jesse-ml-models
          path: |
            strategies/perrobotillo/ml_data/*.csv
            strategies/perrobotillo/ml_data/*.json
            strategies/perrobotillo/ml_data/model_*/*
          retention-days: 60

      - name: Telegram — éxito
        if: success() && github.event.inputs.coin == ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=✅ *Jesse Weekly Retrain* completado\nMonedas: ${{ needs.setup.outputs.coins }}" \
            -d "parse_mode=Markdown" > /dev/null 2>&1

      - name: Telegram — error
        if: failure() && github.event.inputs.coin == ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=🚨 *Jesse Weekly Retrain* falló\nMonedas: ${{ needs.setup.outputs.coins }}\nRevisar logs del workflow." \
            -d "parse_mode=Markdown" > /dev/null 2>&1
