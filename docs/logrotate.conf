# ════════════════════════════════════════════════════════
# 🐕 PERROBOTILLO - LOGROTATE CONFIG
# ════════════════════════════════════════════════════════
# Rotación automática de logs para evitar crecimiento infinito
# Ejecutar: logrotate -f /home/overgon/.openclaw/logs/logrotate.conf
# ════════════════════════════════════════════════════════

# Logs críticos (rotación agresiva - 5MB máx)
/home/overgon/.openclaw/logs/auto-heal.log {
    size 5M
    rotate 4
    compress
    delaycompress
    missingok
    notifempty
    create 0644 overgon overgon
    dateext
    dateformat -%Y%m%d
}

