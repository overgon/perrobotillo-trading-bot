# ════════════════════════════════════════════════════════
# 🐕 PERROBOTILLO DASHBOARD - NGINX CONFIG (FASE 8)
# ════════════════════════════════════════════════════════
# Deploy: nginx + SSL reverse proxy
# Server: Raspberry Pi 5 (192.168.1.100 local)
# Domain: dashboard.perrobotillo.io
# ════════════════════════════════════════════════════════

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name dashboard.perrobotillo.io;
    return 301 https://$server_name$request_uri;
}

# HTTPS main server
server {
    listen 443 ssl http2;
    server_name dashboard.perrobotillo.io;

    # --- SSL (Let's Encrypt) ---
    ssl_certificate /etc/letsencrypt/live/dashboard.perrobotillo.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashboard.perrobotillo.io/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/dashboard.perrobotillo.io/chain.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # --- Security headers ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # --- Proxy to Flask ---
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host:$server_port;

        # WebSocket support (for real-time updates)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeout settings
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # --- Static files (serve directly via nginx) ---
    location /static/ {
        alias /home/vergon/.openclaw/workspace/dashboard/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";

        # SVG/CSS/Fonts with correct MIME types
        types {
            image/svg+xml svg svgz;
            font/woff2 woff2;
            application/font-woff woff;
            text/css css;
        }
    }

    # --- Cache control for HTML (prevent stale dashboard) ---
    location ~ \.html$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }
}

# --- Rate limiting zone (DDoS protection) ---
# Uncomment to enable: limit_req_zone $binary_remote_addr zone=dashboard:10m rate=60r/m;