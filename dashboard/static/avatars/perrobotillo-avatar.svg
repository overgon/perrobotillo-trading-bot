<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Cyberpunk Dog Avatar -->
  <defs>
    <linearGradient id="neonBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f3ff"/>
      <stop offset="100%" style="stop-color:#bc13fe"/>
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff00ff"/>
      <stop offset="100%" style="stop-color:#0aff00"/>
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="#0a0a1a" stroke="url(#neonBlue)" stroke-width="2"/>
  
  <!-- Dog Ears -->
  <ellipse cx="25" cy="30" rx="12" ry="18" fill="#1a1a3a" stroke="url(#neonBlue)" stroke-width="1.5"/>
  <ellipse cx="75" cy="30" rx="12" ry="18" fill="#1a1a3a" stroke="url(#neonBlue)" stroke-width="1.5"/>
  
  <!-- Dog Face -->
  <ellipse cx="50" cy="55" rx="35" ry="30" fill="#1a1a3a" stroke="url(#neonBlue)" stroke-width="2"/>
  
  <!-- Holographic Glasses -->
  <rect x="20" y="45" width="25" height="15" rx="3" fill="rgba(0,243,255,0.3)" stroke="url(#neonBlue)" stroke-width="1.5"/>
  <rect x="55" y="45" width="25" height="15" rx="3" fill="rgba(0,243,255,0.3)" stroke="url(#neonBlue)" stroke-width="1.5"/>
  <line x1="45" y1="52" x2="55" y2="52" stroke="url(#neonBlue)" stroke-width="2"/>
  
  <!-- Eyes (behind glasses) -->
  <circle cx="32" cy="52" r="4" fill="#00f3ff" opacity="0.8"/>
  <circle cx="68" cy="52" r="4" fill="#00f3ff" opacity="0.8"/>
  
  <!-- Nose -->
  <ellipse cx="50" cy="65" rx="6" ry="4" fill="#ff00ff"/>
  
  <!-- Trading Chart on Forehead -->
  <polyline points="35,35 40,32 45,36 50,30 55,34 60,28 65,32" fill="none" stroke="url(#neonPink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Glow Effect -->
  <circle cx="50" cy="50" r="48" fill="none" stroke="url(#neonBlue)" stroke-width="1" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
